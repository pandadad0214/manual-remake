[project]
name = "manual-remake"
version = "0.1.0"
description = "Apify Actor: remake a PDF manual into structured rewrite notes"
requires-python = ">=3.11"
dependencies = [
  "apify>=3.0.0,<5",
  "httpx>=0.27",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "numpy>=1.26",
  "reportlab>=4.2",
]

[dependency-groups]
dev = ["ruff==0.17.3", "pytest>=8"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "SIM115", "S603", "RUF005", "RUF059"]
"**/test_*.py" = ["S101", "S105", "S106", "S108", "SIM115", "S603", "RUF005", "RUF059"]
"src/*" = ["SIM115"]
"src/rewrite.py" = ["E501", "SIM115", "UP031"]  # long prompt/template strings
"src/extract.py" = ["SIM115", "S324"]  # md5 used as content fingerprint, not security
"src/pdfout.py" = ["SIM115", "S110"]
"src/imaging.py" = ["SIM115", "RUF046"]
